<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Maintenance Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #123c63);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1e293b;
        }

        header {
            background: #0b1f36;
            color: white;
            padding: 22px 8%;
        }

        header h2 {
            font-size: 25px;
            color: #38bdf8;
        }

        header p {
            margin-top: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 55px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            color: #123c63;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            font-size: 15px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            border-color: #0284c7;
            outline: 2px solid #bae6fd;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: auto;
            text-align: center;
            color: #cbd5e1;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
                margin: 35px auto;
            }

            header h2 {
                font-size: 21px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>⚙️ Elevator Maintenance Prediction</h2>
    <p>Smart Maintenance | Better Reliability | Higher Uptime</p>
</header>

<main class="container">

    <h1>Maintenance Prediction</h1>

    <p class="subtitle">
        Enter the elevator operating details to predict
        maintenance requirements.
    </p>

    <form action="/predict" method="POST">

        <div class="form-group">
            <label for="trips">Number of Trips</label>
            <input type="number"
                   id="trips"
                   name="Number_of_Trips"
                   min="0"
                   step="any"
                   required>
        </div>

        <div class="form-group">
            <label for="hours">Operating Hours</label>
            <input type="number"
                   id="hours"
                   name="Operating_Hours"
                   min="0"
                   step="any"
                   required>
        </div>

        <div class="form-group">
            <label for="days">Days Since Maintenance</label>
            <input type="number"
                   id="days"
                   name="Days_Since_Maintenance"
                   min="0"
                   step="any"
                   required>
        </div>

        <button type="submit">
            Predict Maintenance →
        </button>

    </form>

</main>

<footer>
    Elevator Maintenance Prediction System
</footer>

</body>
</html>
